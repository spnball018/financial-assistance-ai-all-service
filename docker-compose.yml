networks:
  financial-ai:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

services:

  # Every port is bound to 127.0.0.1. Only `caddy` (profile public) listens on the network: it serves
  # the web UI over HTTPS, and the UI and API require Google sign-in or an API token. On a home
  # server, `cloudflared` (profile tunnel) replaces caddy and opens no ports at all.
  # Secrets come from ./.env (see .env.example) and ./expense-api/.env.

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: financial-ai-postgres
    environment:
      POSTGRES_USER: postgres
      # only used when the volume is first created; changing it later needs ALTER USER inside postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: financial
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - financial-ai
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Gmail tool service ─────────────────────────────────────────────────────
  gmail-service:
    build:
      context: ./gmail-service
    container_name: financial-ai-gmail
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./gmail-service/token.json:/app/token.json
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - financial-ai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Credit card statement service ──────────────────────────────────────────
  credit-card-statement-service:
    build:
      context: ./credit-card-statement-service
    container_name: financial-ai-credit-card-statement
    ports:
      - "127.0.0.1:8003:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - financial-ai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Expense API (sync, reconcile, categorize, REST for the web UI) ─────────
  expense-api:
    build:
      context: ./expense-api
    container_name: financial-ai-expense-api
    ports:
      - "127.0.0.1:8002:8000"
    env_file:
      - path: ./expense-api/.env
        required: false
    environment:
      - GMAIL_SERVICE_URL=http://gmail-service:8000
      - CREDIT_CARD_STATEMENT_SERVICE_URL=http://credit-card-statement-service:8000
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/financial
      - RECEIPTS_DIR=/data/receipts
      - PYTHONUNBUFFERED=1
    volumes:
      # receipt photos; the DB stores only their path (same folder as a local venv run uses)
      - ./data/receipts:/data/receipts
    networks:
      - financial-ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # python:slim has no curl, so probe with the stdlib
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Web UI (nginx serves the built app and proxies /api to expense-api) ────
  web:
    build:
      context: ./web
    container_name: financial-ai-web
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - financial-ai
    restart: unless-stopped
    depends_on:
      expense-api:
        condition: service_healthy

  # ── Public HTTPS entry (docker compose --profile public up -d) ─────────────
  caddy:
    image: caddy:2-alpine
    container_name: financial-ai-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in ./.env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - financial-ai
    restart: unless-stopped
    depends_on:
      - web
    profiles:
      - public

  # ── Public entry via Cloudflare Tunnel (docker compose --profile tunnel up -d) ─
  # For a home server: no open router ports and no Let's Encrypt; Cloudflare terminates HTTPS. Create
  # the tunnel in Cloudflare Zero Trust and route its public hostname (DOMAIN) to http://web:80.
  # Use this or `caddy`, not both.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: financial-ai-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in ./.env}
    networks:
      - financial-ai
    restart: unless-stopped
    depends_on:
      - web
    profiles:
      - tunnel

  # ── Nightly database backup (profiles public and tunnel) ──────────────────
  # pg_dump once a day into ./data/backups, keeping BACKUP_KEEP_DAYS (default 14) days. A dump
  # without expense-api/.env SECRET_KEY cannot decrypt Gmail tokens or KTC passwords; keep both, apart.
  db-backup:
    image: postgres:16-alpine
    container_name: financial-ai-db-backup
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:-postgres}
      - KEEP_DAYS=${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./data/backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          f=/backups/financial-$$(date +%Y%m%d-%H%M).dump
          pg_dump -h postgres -U postgres -Fc financial > "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "backup $$f" \
            || { rm -f "$$f.tmp"; echo "backup FAILED"; }
          find /backups -name 'financial-*.dump' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done
    networks:
      - financial-ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - public
      - tunnel

  # ── One-shot OAuth helper (run manually when token.json is missing/expired) ─
  gmail-auth:
    build:
      context: ./gmail-service
    container_name: financial-ai-gmail-auth
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./gmail-service:/app
      - ./credentials.json:/app/credentials.json
    command: python auth.py
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - financial-ai
    profiles:
      - manual

  # ── LangGraph chatbot (interactive) ──────────────────────────────────────
  chatbot:
    build:
      context: ./langgraph
    container_name: financial-ai-chatbot
    command: python chatbot.py --label INBOX --max-results 20
    stdin_open: true
    tty: true
    env_file:
      - ./langgraph/.env
    environment:
      - GMAIL_SERVICE_URL=http://gmail-service:8000
      - CREDIT_CARD_STATEMENT_SERVICE_URL=http://credit-card-statement-service:8000
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/financial
      - PYTHONUNBUFFERED=1
    networks:
      - financial-ai
    depends_on:
      postgres:
        condition: service_healthy
      gmail-service:
        condition: service_healthy
      credit-card-statement-service:
        condition: service_healthy
    profiles:
      - chatbot

  # ── LangGraph batch (non-interactive) ────────────────────────────────────
  langgraph:
    build:
      context: ./langgraph
    container_name: financial-ai-langgraph
    command: python main.py --label INBOX --max-results 20
    env_file:
      - ./langgraph/.env
    environment:
      - GMAIL_SERVICE_URL=http://gmail-service:8000
      - CREDIT_CARD_STATEMENT_SERVICE_URL=http://credit-card-statement-service:8000
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/financial
      - PYTHONUNBUFFERED=1
    networks:
      - financial-ai
    depends_on:
      postgres:
        condition: service_healthy
      gmail-service:
        condition: service_healthy
      credit-card-statement-service:
        condition: service_healthy
    profiles:
      - run
