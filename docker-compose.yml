networks:
  financial-ai:
    driver: bridge

volumes:
  postgres_data:

services:

  # Every port is bound to 127.0.0.1: nothing here has authentication yet, so keep it off the LAN.
# Secrets come from ./.env (see .env.example) and ./expense-api/.env.

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: financial-ai-postgres
    environment:
      POSTGRES_USER: postgres
      # only used when the volume is first created; changing it later needs ALTER USER inside postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: financial
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - financial-ai
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Gmail tool service ─────────────────────────────────────────────────────
  gmail-service:
    build:
      context: ./gmail-service
    container_name: financial-ai-gmail
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./gmail-service/token.json:/app/token.json
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - financial-ai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Credit card statement service ──────────────────────────────────────────
  credit-card-statement-service:
    build:
      context: ./credit-card-statement-service
    container_name: financial-ai-credit-card-statement
    ports:
      - "127.0.0.1:8003:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - financial-ai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Expense API (sync, reconcile, categorize, REST for the web UI) ─────────
  expense-api:
    build:
      context: ./expense-api
    container_name: financial-ai-expense-api
    ports:
      - "127.0.0.1:8002:8000"
    env_file:
      - path: ./expense-api/.env
        required: false
    environment:
      - GMAIL_SERVICE_URL=http://gmail-service:8000
      - CREDIT_CARD_STATEMENT_SERVICE_URL=http://credit-card-statement-service:8000
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/financial
      - PYTHONUNBUFFERED=1
    networks:
      - financial-ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # python:slim has no curl, so probe with the stdlib
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Web UI (nginx serves the built app and proxies /api to expense-api) ────
  web:
    build:
      context: ./web
    container_name: financial-ai-web
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - financial-ai
    restart: unless-stopped
    depends_on:
      expense-api:
        condition: service_healthy

  # ── One-shot OAuth helper (run manually when token.json is missing/expired) ─
  gmail-auth:
    build:
      context: ./gmail-service
    container_name: financial-ai-gmail-auth
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./gmail-service:/app
      - ./credentials.json:/app/credentials.json
    command: python auth.py
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - financial-ai
    profiles:
      - manual

  # ── LangGraph chatbot (interactive) ──────────────────────────────────────
  chatbot:
    build:
      context: ./langgraph
    container_name: financial-ai-chatbot
    command: python chatbot.py --label INBOX --max-results 20
    stdin_open: true
    tty: true
    env_file:
      - ./langgraph/.env
    environment:
      - GMAIL_SERVICE_URL=http://gmail-service:8000
      - CREDIT_CARD_STATEMENT_SERVICE_URL=http://credit-card-statement-service:8000
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/financial
      - PYTHONUNBUFFERED=1
    networks:
      - financial-ai
    depends_on:
      postgres:
        condition: service_healthy
      gmail-service:
        condition: service_healthy
      credit-card-statement-service:
        condition: service_healthy
    profiles:
      - chatbot

  # ── LangGraph batch (non-interactive) ────────────────────────────────────
  langgraph:
    build:
      context: ./langgraph
    container_name: financial-ai-langgraph
    command: python main.py --label INBOX --max-results 20
    env_file:
      - ./langgraph/.env
    environment:
      - GMAIL_SERVICE_URL=http://gmail-service:8000
      - CREDIT_CARD_STATEMENT_SERVICE_URL=http://credit-card-statement-service:8000
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/financial
      - PYTHONUNBUFFERED=1
    networks:
      - financial-ai
    depends_on:
      postgres:
        condition: service_healthy
      gmail-service:
        condition: service_healthy
      credit-card-statement-service:
        condition: service_healthy
    profiles:
      - run
