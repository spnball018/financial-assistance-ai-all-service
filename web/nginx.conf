server {
    listen 80;
    root /usr/share/nginx/html;

    # same contract as the Vite dev server: /api/* -> expense-api without the /api prefix
    location /api/ {
        proxy_pass http://expense-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 12m;      # receipt photos (expense-api accepts up to 10 MB)
        proxy_read_timeout 900s;       # the first sync can take minutes
    }

    location / {
        try_files $uri /index.html;
    }
}
