server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # Caddy sets these too; behind Cloudflare Tunnel nginx is the only place they come from
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # same contract as the Vite dev server: /api/* -> expense-api without the /api prefix
    location /api/ {
        proxy_pass http://expense-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 12m;      # receipt photos (expense-api accepts up to 10 MB)
        proxy_read_timeout 900s;       # the first sync can take minutes
    }

    location / {
        try_files $uri /index.html;
    }
}
